name: ResolveIt CD Workflow

on:
  workflow_run:
    workflows: ["ResolveIt CI Workflow"]
    types:
      - completed
    branches: [ main ]

permissions:
  contents: read
  actions: read

jobs:
  build-docker:
    runs-on: ubuntu-26.04
    name: Build Docker Image
    # Si avvia solo se la CI ha avuto successo dopo una pull request
    if: ${{ github.event.workflow_run.conclusion == 'success'}}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download JAR artifact
        uses: actions/download-artifact@v8
        with:
          name: resolveit-${{ github.event.workflow_run.head_sha }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: target/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/resolveit_sd
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max